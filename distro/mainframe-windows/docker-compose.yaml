services:
  api:
    image: sama3l/mainframe-api:1.0
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DB_PATH: /data/db
      GALLERY_PATH: /data/uploads
      ALLOWED_URLS: ${ALLOWED_URLS:-}
      TUNNEL_METRICS_URL: http://tunnel:20241
    volumes:
      - ${DB_PATH:-./data/db}:/data/db
      - ${GALLERY_PATH:-./data/uploads}:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://api:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  setup:
    image: sama3l/mainframe-setup:1.0
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      DB_PATH: /data/db
      TUNNEL_METRICS_URL: http://tunnel:20241
      OPEN_BROWSER: "false"
    volumes:
      - ${DB_PATH:-./data/db}:/data/db
    depends_on:
      tunnel:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped